<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexovary Studio</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        width: min(720px, calc(100% - 2rem));
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 2.5vw, 2.1rem); }
      p { margin: 0; line-height: 1.6; color: #cbd5e1; }
      code {
        background: rgba(148, 163, 184, 0.15);
        border-radius: 6px;
        padding: .1rem .35rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Nexovary Studio</h1>
      <p>
        Репозиторий подготовлен: стартовая страница добавлена, файл
        <code>index.html</code> находится в корне проекта.
      </p>
    </main>
  </body>
</html>
